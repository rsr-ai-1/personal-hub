name: Validate All Scripts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
     - name: Run every Python module
        run: |
          for f in *.py; do
            if [ "$f" = "main.py" ]; then
              echo "q" | python "$f"
            else
              python "$f"
            fi
          done
